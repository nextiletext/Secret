<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            cursor: pointer;
            z-index: 10;
            background: #0d1117;
        }
        video {
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            display: none;
        }
    </style>
</head>
<body>

    <!-- Fake loading/verification screen -->
    <div id="overlay" onclick="rickroll()">
        <h2>Click anywhere to continue</h2>
    </div>

    <video id="myVideo" src="rickroll.mp4" loop playsinline></video>

    <script>
        function rickroll() {
            const video = document.getElementById('myVideo');
            const overlay = document.getElementById('overlay');
            
            // Unhide video and play with full sound
            overlay.style.display = 'none';
            video.style.display = 'block';
            video.muted = false;
            video.play();
        }
    </script>

</body>
</html>
